name: Diawars
version: '5.1-beta'
main: de.davidsw.diawars.Diawars
api-version: '26.2'
author: DavidSW

depend: [NBTAPI]

commands:
  teamzones:
    description: Befehl für die Border
    usage: /<command> <info|border>
    permission: diawars.use
  pvp:
    description: Schaltet PvP an oder aus (5 Minuten Wartezeit)
    usage: /<command> [<status|cancel|toggle>]
    permission: diawars.use
  scores:
    description: Anzeige des Punktestands
    usage: /<command> <info|sidebar>
    permission: diawars.use
  menu:
    description: Hauptmenü des Plugins
    usage: /<command>
    permission: diawars.use
  selfkill:
    description: Self-kill Befehl
    usage: /<command>
    permission: diawars.use
  event:
    description: Event-System des Plugins
    usage: /<command> <create|resume|submit|cancel|join|leave|list|config>
    permission: diawars.use
  lobby:
    description: Betritt oder verlässt die Lobby
    usage: /<command>
    permission: diawars.use
  inv:
    description: Öffnet eine gehaltene Shulker-Box oder Enderkiste
    usage: /<command>
    permission: diawars.use
  vault:
    description: Vault-Beanspruchung und Verwaltung
    usage: /<command> <claim|unclaim|invite|ban|info|list>
    permission: diawars.use
  bug:
    description: Meldet Bugs
    usage: /<command> <report>
    permission: diawars.use
  admin:
    description: Admin-Befehle (Reload, Inventar-Inspektion, Log, Bug-, Event- und PvP-Verwaltung)
    usage: /<command> <reload|inv|log|bug|event|pvp>
    permission: diawars.admin

permissions:
  diawars.use:
    description: Standardberechtigung für gewöhnliche Spieler
    default: true
  diawars.admin:
    description: Erlaubt Admin-Befehle
    default: op
