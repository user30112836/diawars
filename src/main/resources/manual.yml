overview:
  title: "Kurzübersicht"
  pages:
    - |
      <aqua><bold>Diawars</bold></aqua>
      <gray>Kurzübersicht</gray>

      <dark_gray>Diawars ist ein Teamspiel um Diamanten. Diamanten sind Punkte und Währung zugleich. Sammle, verteidige und sichere sie als Blöcke im Vault.</dark_gray>
    - |
      <aqua><bold>Zonen</bold></aqua>

      <dark_gray>Die Hauptwelt ist bei X=0 geteilt: westlich liegt die Zone von Team A, östlich die von Team B. Der Kompass im Menü verrät dir, ob du zu Hause bist.</dark_gray>
    - |
      <aqua><bold>Diamanten</bold></aqua>

      <dark_gray>Nimmst du mehr als 32 Diamanten auf, fällt der Rest beim ausloggen vor deine Füße. Kills geben +2, alle 30 Min Spielzeit +1 Diamanten. Gedroppte Diamanten lösen sich nach 10 Min auf.</dark_gray>
    - |
      <aqua><bold>Gegnerzone</bold></aqua>

      <dark_gray>Blöcke reagieren dort nicht auf Rechts- oder Linksklicks. Essen, Trinken, Werfen und Angreifen geht normal. Diamantblöcke aus Gegner-Vaults darfst du abbauen.</dark_gray>
    - |
      <aqua><bold>Menü</bold></aqua>

      <dark_gray>Alles läuft über das Menü (</dark_gray><gold>/menu</gold><dark_gray>).</dark_gray>

      <dark_gray>Steckst du fest, töte dich mit Selfkill im Menü. Zum Pausieren gehe in die Lobby: dort bist du sicher. Fehler meldest du über das Buch im Menü. Etc.</dark_gray>

rules:
  title: "Serverregeln"
  pages:
    - |
      <aqua><bold>Serverregeln</bold></aqua>

      <red>1.</red> <dark_gray>Kein Bug-Abuse. Gefundene Fehler bitte über das Menü oder /bug report melden.</dark_gray>

      <red>2.</red> <dark_gray>Kein Spam bei Bug-Reports oder im Chat.</dark_gray>

      <red>3.</red> <dark_gray>Kein Griefing außerhalb der Gegnerzone.</dark_gray>
    - |
      <aqua><bold>Serverregeln</bold></aqua>

      <red>4.</red> <dark_gray>Kein Einsatz von Cheats, Hacks oder unerlaubten Modifikationen.</dark_gray>

      <red>5.</red> <dark_gray>Respektvoller Umgang mit anderen Spielern.</dark_gray>
    - |
      <aqua><bold>Serverregeln</bold></aqua>

      <red>6.</red> <dark_gray>Anweisungen der Admins sind zu befolgen.</dark_gray>

      <gray>Verstöße können zu Verwarnungen oder Bans führen.</gray>

segments:
  diamanten:
    title: "Diamanten & Punkte"
    pages:
      - |
        <aqua><bold>Diamanten</bold></aqua>

        <dark_gray>Diamanten sind alles: Währung und Punktestand zugleich. Sie leuchten am Boden und zeigen wie lange sie noch daliegen. 
        
        Gedroppte Diamanten lösen sich nach 10 Min. auf.</dark_gray>
      - |
        <aqua><bold>Limit</bold></aqua>

        <dark_gray>Nimmst du mehr als 32 Diamanten auf, fällt der Rest beim ausloggen vor deine Füße. 
        
        Diamanten können nicht auf normalem Weg gefunden werden.</dark_gray>
      - |
        <aqua><bold>Lagerung</bold></aqua>

        <dark_gray>Kisten, Shulker, Endertruhen und andere Kontainer mit Diamanten explodieren. Die Diamanten fallen dabei heraus.</dark_gray>

        <dark_gray>Trage sie im Inventar oder sichere sie als Block im Vault.</dark_gray>
      - |
        <aqua><bold>Nachschub</bold></aqua>

        <dark_gray>Statt dessen gibt der Server dir bei bestimmten Ereignissen Diamanten als Belohnung. Kills geben +2, alle 30 Min. Spielzeit +1. Ist dein Inventar voll, wird der Rest nachgeliefert, sobald Platz frei ist.</dark_gray>
      - |
        <aqua><bold>Punktestand</bold></aqua>

        <dark_gray>Der Diamant im Menü zeigt deine und die Team-Diamanten, Vault-Inhalte zählen mit. Sidebar stellst du im Menü ein.</dark_gray>

        <dark_gray>Jede Bewegung landet im Log und ist für Admins einsehbar.</dark_gray>

  pvp:
    title: "PvP"
    pages:
      - |
        <aqua><bold>PvP</bold></aqua>

        <dark_gray>PvP ist standardmäßig aktiviert. Im Menü schaltest du es um. Jede Änderung greift erst nach </dark_gray><gold>5 Min.</gold><dark_gray> Verzögerung.</dark_gray>

        <dark_gray>Eine wartende Änderung brichst du dort mit einem weiteren Klick wieder ab.</dark_gray>
      - |
        <aqua><bold>Kampfregeln</bold></aqua>

        <dark_gray>Nach jedem Treffer giltst du 2 Min. als im Kampf: Dein Status lässt sich nicht ändern und eine wartende Änderung verfällt sofort. 
        
        Loggst du dich im Kampf aus, lässt du alle Diamanten fallen!</dark_gray>
      - |
        <aqua><bold>Selfkill</bold></aqua>

        <dark_gray>Festgefahren oder verloren? Der Knochen im Menü tötet dich sofort. Im Kampf ist Selfkill gesperrt. Dein Inventar bleibt dank Keep-Inventory erhalten, aber Kills verschenken Diamanten an den Gegner.</dark_gray>

  vaults:
    title: "Vaults"
    pages:
      - |
        <aqua><bold>Vaults</bold></aqua>

        <dark_gray>Jedes Team besitzt Vault-Gebiete. Nur dort kannst du Diamantblöcke platzieren. Jeder Block im Vault zählt </dark_gray><gold>9 Diamanten</gold><dark_gray> für dein Team.</dark_gray>
      - |
        <aqua><bold>Beanspruchen</bold></aqua>

        <dark_gray>Stelle dich in die Nähe eines freien Vaults deines Teams und beanspruche es über das Menü. Jeder Spieler hält höchstens ein Vault.</dark_gray>

        <dark_gray>Nur du und eingeladene Spieler dürfen dort Blöcke setzen und abbauen.</dark_gray>
      - |
        <aqua><bold>Einladungen</bold></aqua>

        <dark_gray>Lade im Vault-Menü mit Spieler einladen Teammitglieder ein. Gib dann den Namen an.</dark_gray>

        <dark_gray>Eingeladene dürfen dort Blöcke setzen und abbauen wie du. Du bleibst Besitzer und kannst die wieder ausladen.</dark_gray>
      - |
        <aqua><bold>Raub</bold></aqua>

        <dark_gray>Achtung: Gegner können die Blöcke in deinem Vault stehlen.</dark_gray>

        <dark_gray>Umgekehrt darfst du auch Diamantblöcke aus Gegner-Vaults abbauen und für dein Team mitnehmen.</dark_gray>

  events:
    title: "Events"
    pages:
      - |
        <aqua><bold>Events</bold></aqua>

        <dark_gray>Events sind Minispiele von Spielern. Du baust in einer eigenen Kreativ-Welt, reichst es ein, Admins prüfen es und geben es mit Start- und Endzeit frei. Zum Starttermin geht das Event automatisch live.</dark_gray>
      - |
        <aqua><bold>Mitmachen</bold></aqua>

        <dark_gray>Aktive und anstehende Events findest du im Menü unter Events. Mit einem Klick tritts du bei.</dark_gray>

        <dark_gray>Während eines Events gelten dessen eigene Regeln. Verlassen geht jederzeit über das Menü.</dark_gray>
      - |
        <aqua><bold>Selbst bauen</bold></aqua>

        <dark_gray>Lege im Event-Menü ein Event an und baue los. Reiche es ein, sobald es fertig ist. Angenommene Events bringen dir </dark_gray><gold>5 Dias</gold><dark_gray>.</dark_gray>

        <dark_gray>Spielmodus, Tageszeit, Gamerules, Effekte und Startinventar stellst du als Ersteller im Menü ein.</dark_gray>
      - |
        <aqua><bold>Belohnungen</bold></aqua>

        <dark_gray>Nach dem Event meldest du als Ersteller die Gewinner an einen Admin. Nur gemeldete Spieler bekommen eine Belohnung.</dark_gray>

        <dark_gray>Der Admin gibt den Gewinnern dann ihre Diamanten.</dark_gray>

  zonen:
    title: "Zonen & Border"
    pages:
      - |
        <aqua><bold>Zonen</bold></aqua>

        <dark_gray>Die Hauptwelt ist bei X=0 geteilt. Westlich davon liegt die Zone von Team A, östlich die von Team B. Beim Übertritt meldet sich das Spiel.</dark_gray>

        <dark_gray>Ob du gerade zu Hause bist, verrät die Sidebar oder der Kompass im Menü.</dark_gray>
      - |
        <aqua><bold>Gegnerzone</bold></aqua>

        <dark_gray>Blöcke reagieren dort nicht auf Rechts- oder Linksklicks. Essen, Trinken, Werfen und Angreifen geht normal.</dark_gray>

        <dark_gray>Diamantblöcke aus Gegner-Vaults darfst du abbauen.</dark_gray>
      - |
        <aqua><bold>Border</bold></aqua>

        <dark_gray>Die Grenze bei X=0 ist eine Partikellinie in der Luft. Im Menü unter Border stellst du die Partikel ein.</dark_gray>

        <dark_gray>Achtung: Mit wenigen Partikeln, Texture-Packs oder Shadern siehst du sie eventuell nicht.</dark_gray>

  menue:
    title: "Menü, Lobby & Extras"
    pages:
      - |
        <aqua><bold>Das Menü</bold></aqua>

        <dark_gray>Das Menü ist deine Schaltzentrale: PvP, Selfkill, Border, Sidebar, Punktestand, Zonen-Info, Events, Vault, Handbuch, Bug-Meldung, Inventar und Lobby.</dark_gray>

        <dark_gray>Du öffnest es mit </dark_gray><gold>/menu</gold><dark_gray>.</dark_gray>
      - |
        <aqua><bold>Lobby</bold></aqua>

        <dark_gray>Die Lobby ist eine sichere Wartewelt: kein Schaden, kein Abbauen, kein Bauen.</dark_gray>

        <dark_gray>Im Kampf oder während eines Events kannst du nicht in die Lobby.</dark_gray>
      - |
        <aqua><bold>Kisten & AFK</bold></aqua>

        <dark_gray>Halte eine Shulker-Box oder Enderkiste in der Hand und öffne sie direkt über das Menü, ganz ohne Platzieren. Dies ist praktisch in der gegnerischen Zone wo du keine Blöcke platzieren oder abbauen kannst.</dark_gray>

      - |
        <aqua><bold>AFK</bold></aqua>
        
        <dark_gray>Nach </dark_gray><gold>5 Min.</gold><dark_gray> ohne Eingabe giltst du als AFK. Nachrichten an dich warten dann auf deine Rückkehr und du erhältst keine Belohnung für Spielzeit.</dark_gray>

  hilfe:
    title: "Hilfe & Bugs"
    pages:
      - |
        <aqua><bold>Fehler melden</bold></aqua>

        <dark_gray>Etwas kaputt? Melde es über das Buch im Menü oder mit </dark_gray><gold>/bug report</gold><dark_gray>.</dark_gray>

        <dark_gray>Beschreibe genau, was du getan hast und was passiert ist. Jeden Fehler bitte nur einmal melden.</dark_gray>
      - |
        <aqua><bold>Bug-Abuse</bold></aqua>

        <dark_gray>Gefundene Fehler auszunutzen ist verboten und wird bestraft, siehe Regeln.</dark_gray>

        <dark_gray>Wer fair meldet, hilft dem Server. Danke dafür!</dark_gray>
