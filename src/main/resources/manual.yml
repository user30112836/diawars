overview:
  title: "Kurzübersicht"
  pages:
    - |
      <aqua><bold>Diawars</bold></aqua>
      <gray>Kurzübersicht</gray>

      <dark_gray>Diawars ist ein teambasiertes
      Diamanten-PvP Spiel. Sammle
      Diamanten, verteidige deine Zone
      und greife die gegnerische an!</dark_gray>

      <gold>/menu</gold> <gray>öffnet das
      Hauptmenü mit allen Funktionen.</gray>

rules:
  title: "Serverregeln"
  pages:
    - |
      <aqua><bold>Serverregeln</bold></aqua>

      <red>1.</red> <dark_gray>Kein Bug-Abuse.
      Gefundene Fehler bitte über
      /bug report melden.</dark_gray>

      <red>2.</red> <dark_gray>Kein Spam bei
      Bug-Reports oder im Chat.</dark_gray>

      <red>3.</red> <dark_gray>Kein Griefing
      außerhalb der Gegnerzone.</dark_gray>
    - |
      <aqua><bold>Serverregeln</bold></aqua>

      <red>4.</red> <dark_gray>Kein Einsatz von
      Cheats, Hacks oder unerlaubten
      Modifikationen.</dark_gray>

      <red>5.</red> <dark_gray>Respektvoller
      Umgang mit anderen Spielern.</dark_gray>

      <red>6.</red> <dark_gray>Anweisungen der
      Admins sind zu befolgen.</dark_gray>

      <gray>Verstöße können zu Verwarnungen
      oder Bans führen.</gray>

segments:
  pvp:
    title: "PvP-System"
    pages:
      - |
        <aqua><bold>PvP-System</bold></aqua>

        <dark_gray>Mit </dark_gray><gold>/pvp</gold>
        <dark_gray>schaltest du PvP an oder
        aus. Änderungen greifen erst nach
        5 Minuten Verzögerung.</dark_gray>

        <dark_gray>Während eines Kampfes kannst
        du deinen PvP-Status nicht ändern
        und solltest nicht ausloggen!</dark_gray>
      - |
        <aqua><bold>PvP-System</bold></aqua>

        <gold>/pvp status</gold>
        <gray>Zeigt deinen aktuellen Status</gray>

        <gold>/pvp cancel</gold>
        <gray>Bricht eine wartende Änderung ab</gray>

        <dark_gray>Beim Töten eines Gegners
        erhältst du Diamanten als
        Belohnung.</dark_gray>

  vaults:
    title: "Vaults"
    pages:
      - |
        <aqua><bold>Vaults</bold></aqua>

        <dark_gray>Jedes Team besitzt Vaults,
        in denen Diamantblöcke sicher
        gelagert werden können.</dark_gray>

        <gold>/vault claim</gold>
        <gray>Beansprucht ein Vault in
        deiner Nähe</gray>

        <gold>/vault invite &lt;spieler&gt;</gold>
        <gray>Lädt ein Teammitglied ein</gray>
      - |
        <aqua><bold>Vaults</bold></aqua>

        <gold>/vault ban &lt;spieler&gt;</gold>
        <gray>Entfernt einen eingeladenen
        Spieler</gray>

        <gold>/vault info</gold> <gray>/</gray>
        <gold>/vault list</gold>
        <gray>Zeigt deine bzw. alle Vaults</gray>

        <dark_gray>Nur du und eingeladene
        Spieler können in deinem Vault
        Diamantblöcke platzieren.</dark_gray>

  events:
    title: "Events"
    pages:
      - |
        <aqua><bold>Events</bold></aqua>

        <dark_gray>Spieler können eigene
        Minigame-Events bauen und zur
        Prüfung einreichen.</dark_gray>

        <gold>/event create &lt;name&gt;</gold>
        <gray>Erstellt ein neues Event</gray>

        <gold>/event submit</gold>
        <gray>Reicht dein Event ein</gray>
      - |
        <aqua><bold>Events</bold></aqua>

        <gold>/event join &lt;id&gt;</gold>
        <gray>Tritt einem aktiven Event bei</gray>

        <gold>/event list</gold>
        <gray>Zeigt verfügbare Events</gray>

        <dark_gray>Angenommene Events werden
        automatisch zur Startzeit
        aktiviert.</dark_gray>

  zones:
    title: "Zonen & Border"
    pages:
      - |
        <aqua><bold>Zonen & Border</bold></aqua>

        <dark_gray>Die Welt ist bei X=0 in
        zwei Team-Zonen geteilt. Die
        Grenze wird durch Partikel
        dargestellt.</dark_gray>

        <gold>/teamzones info</gold>
        <gray>Zeigt deinen Zonen-Status</gray>
      - |
        <aqua><bold>Zonen & Border</bold></aqua>

        <gold>/teamzones border</gold>
        <gray>Passt Partikel, Farbe,
        Sichtweite und Dichte der
        Grenze an</gray>

        <dark_gray>In der Gegnerzone kannst
        du nur mit deinem Item in der
        Hand interagieren.</dark_gray>

  scoreboard:
    title: "Scoreboard & Anzeige"
    pages:
      - |
        <aqua><bold>Scoreboard</bold></aqua>

        <gold>/scores info</gold>
        <gray>Zeigt den aktuellen
        Punktestand</gray>

        <gold>/scores sidebar</gold>
        <gray>Schaltet die Sidebar an
        oder aus</gray>
      - |
        <aqua><bold>Scoreboard</bold></aqua>

        <dark_gray>Über das Menü kannst du
        einzelne Anzeige-Komponenten wie
        Team-Diamanten oder deinen
        Vault-Stand ein- und
        ausblenden.</dark_gray>

  lobby:
    title: "Lobby"
    pages:
      - |
        <aqua><bold>Lobby</bold></aqua>

        <gold>/lobby</gold>
        <gray>Betritt oder verlässt die
        Lobby</gray>

        <dark_gray>In der Lobby kannst du
        keinen Schaden nehmen und
        keine Blöcke abbauen oder
        platzieren.</dark_gray>

  bugs:
    title: "Bug-Reports"
    pages:
      - |
        <aqua><bold>Bug-Reports</bold></aqua>

        <gold>/bug report &lt;beschreibung&gt;</gold>
        <gray>Meldet einen gefundenen
        Fehler</gray>

        <dark_gray>Bitte beschreibe Fehler so
        genau wie möglich und melde
        jeden Bug nur einmal.</dark_gray>