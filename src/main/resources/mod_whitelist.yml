# Hinweis: fabric-api / fabricloader / minecraft / forge werden vom Client bereits
# vorgefiltert und tauchen hier nicht auf, müssen also nicht gelistet werden.
# Forge-Port (diawars-client-forge, Mod-Id "diawars_client") sendet dasselbe
# diawars:client_info-Paket wie die Fabric-Mod und ist immer erlaubt.
# Forge-Mods mit Underscore-Ids (z.B. "oculus" statt "iris", "cloth_config")
# ggf. hier zusätzlich zur Fabric-Schreibweise eintragen.
#
# Die Liste ist zweigeteilt (beide Abschnitte bitte alphabetisch sortiert halten):
# - allowed_mods: Mods, die Spieler selbst installieren. Jede Zeile hat zwei
#   Felder: "check" steht auf der Mod-Id, auf die der Client-Info-Check prüft,
#   "display" ist der Name, den Spieler in der Mod-Liste sehen (Menü-/mods-
#   Dialog der Client-Mod). Einzeilige Ids sind weiterhin erlaubt — dann wird
#   der Anzeigename automatisch aus der Id abgeleitet.
# - libraries: Abhängigkeiten, die von den Mods oben automatisch mitgebracht
#   werden. Spieler installieren diese nicht selbst; sie sind nur gelistet,
#   damit der Check sie nicht blockiert (Prüfung nur auf der Id).

